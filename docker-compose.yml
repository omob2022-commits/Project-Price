version: "3.9"

services:
  # ─── PostGIS Database ────────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    container_name: landval-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-landval}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-landval_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-landval} -d ${POSTGRES_DB:-landval_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── FastAPI Backend ─────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: landval-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-landval}:${POSTGRES_PASSWORD:-changeme_in_production}@db:5432/${POSTGRES_DB:-landval_db}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-landval}:${POSTGRES_PASSWORD:-changeme_in_production}@db:5432/${POSTGRES_DB:-landval_db}
      SECRET_KEY: ${SECRET_KEY:-replace-with-a-secure-random-key}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
    driver: local
